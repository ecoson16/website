name: One-time Bun Lockfile Refresh

on:
  push:
    branches: [improve-theme-maker]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: improve-theme-maker
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate lockfile
        run: |
          bun install
          test -f bun.lock
          git add bun.lock
          if [ -e bun.lockb ]; then
            git rm -f bun.lockb
          fi
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: migrate to current Bun text lockfile"
          git push origin HEAD:improve-theme-maker
