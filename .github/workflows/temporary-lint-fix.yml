name: Temporary Theme Maker Lint Fix

on:
  push:
    branches: [improve-theme-maker]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: improve-theme-maker
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Apply safe lint fixes
        run: |
          ./node_modules/.bin/eslint --fix \
            src/components/themes/ThemeGenerator.vue \
            src/constants/color-presets.ts \
            src/lib/helpers/color-contrast.ts \
            src/lib/helpers/color-contrast.test.ts \
            src/lib/helpers/hex-to-rgba.ts \
            src/lib/helpers/hex-to-rgba.test.ts \
            src/lib/helpers/read-imported-colors.ts \
            src/lib/helpers/read-imported-colors.test.ts \
            src/lib/helpers/read-theme-generator-colors.ts \
            src/lib/helpers/read-theme-generator-styles.ts \
            src/lib/helpers/theme-validation.ts \
            src/lib/helpers/theme-validation.test.ts
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/themes/ThemeGenerator.vue \
            src/constants/color-presets.ts \
            src/lib/helpers/color-contrast.ts \
            src/lib/helpers/color-contrast.test.ts \
            src/lib/helpers/hex-to-rgba.ts \
            src/lib/helpers/hex-to-rgba.test.ts \
            src/lib/helpers/read-imported-colors.ts \
            src/lib/helpers/read-imported-colors.test.ts \
            src/lib/helpers/read-theme-generator-colors.ts \
            src/lib/helpers/read-theme-generator-styles.ts \
            src/lib/helpers/theme-validation.ts \
            src/lib/helpers/theme-validation.test.ts
          if git diff --cached --quiet; then
            echo "No auto-fixable changes."
            exit 0
          fi
          git commit -m "style: apply ESLint autofixes to theme maker"
          git push origin HEAD:improve-theme-maker
